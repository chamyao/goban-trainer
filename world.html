<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Kingdoms · World</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b2418; color: #f4ead2; font: 15px/1.4 Georgia, "Songti SC", serif; overflow: hidden; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #game { position: absolute; inset: 0; }
  #game canvas { image-rendering: pixelated; }
  #town-ui { position: absolute; inset: 0; pointer-events: none; }
  .town-goal { position: absolute; top: 12px; left: 12px; max-width: 46ch; padding: 6px 12px; background: rgba(40, 24, 16, .82); border: 2px solid #c79a4a; border-radius: 6px; font-size: 14px; }
  .town-goal::before { content: "◆ "; color: #e6c14a; }
  .town-hint { position: absolute; transform: translate(-50%, -100%); padding: 1px 6px; background: #f4ead2; color: #3a2416; border: 2px solid #3a2416; border-radius: 4px; font: bold 11px/1.3 system-ui, sans-serif; }
  .town-dlg { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(760px, calc(100vw - 32px)); min-height: 110px; display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; background: #f4ead2; color: #2c1c12; border: 4px solid #7a3a22; border-radius: 8px; box-shadow: 0 6px 0 rgba(0, 0, 0, .35); box-sizing: border-box; }
  .town-face { width: 102px; height: 102px; image-rendering: pixelated; background: #e2d2ac; border: 3px solid #7a3a22; border-radius: 4px; flex: none; }
  .town-who { font-weight: bold; color: #8a2a1a; margin-bottom: 2px; }
  .town-en { font-size: 17px; }
  .town-zh { margin-top: 6px; color: #6a5440; font-size: 15px; }
  .town-more { position: absolute; right: 14px; bottom: 6px; color: #8a2a1a; animation: bob 1s infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  .town-puz { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .45); pointer-events: auto; }
  .town-puz-box { width: min(420px, calc(100vw - 32px)); padding: 20px 24px; background: #f4ead2; color: #2c1c12; border: 4px solid #7a3a22; border-radius: 8px; text-align: center; }
  .town-puz-t { font-size: 20px; font-weight: bold; color: #8a2a1a; }
  .town-puz button { margin-top: 6px; padding: 8px 18px; font: inherit; color: #fff; background: #8a2a1a; border: 0; border-radius: 6px; cursor: pointer; }
  .town-keys { position: absolute; right: 12px; top: 12px; padding: 6px 10px; background: rgba(40, 24, 16, .7); border-radius: 6px; font: 12px/1.5 system-ui, sans-serif; color: #e8dcc0; }
  .town-keys b { display: inline-block; min-width: 1.4em; padding: 0 4px; margin-right: 2px; text-align: center; background: #f4ead2; color: #3a2416; border-radius: 3px; }
  #world-place { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: 30px; letter-spacing: .08em; color: #f4ead2; text-shadow: 0 2px 0 #3a2416, 0 0 12px rgba(0,0,0,.6); opacity: 0; pointer-events: none; }
  #world-place.show { animation: placeName 2.6s ease-out; }
  @keyframes placeName { 0% { opacity: 0; transform: translateY(6px); } 15%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game"></div>
  <div id="town-ui"></div>
  <div id="world-place"></div>
  <div class="town-keys"><b>WASD</b>/<b>↑↓←→</b> walk · <b>Shift</b> run · <b>Space</b> talk</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script src="tk.js"></script>
<script src="tk-town.js"></script>
<script src="tk-world.js"></script>
<script>window.__g = startWorld("game");</script>
</body>
</html>
