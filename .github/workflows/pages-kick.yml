name: Pages build request

# GitHub Pages builds this site from main by itself, but on 2026-10-05 it stopped picking up pushes
# (no "pages build and deployment" run after 17:44 UTC). This asks for a build on every push to main
# (and by hand), so the site never sits stale.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
          echo
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | head -c 800
