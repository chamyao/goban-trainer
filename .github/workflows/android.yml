name: Android APK

# The app loads the live site at launch (android-app/boot.html), so web changes reach it without a
# new APK; a new APK (and the in-app "update available" bar) is only for changes to the app itself.
on:
  push:
    branches: [main]   # (one build per change: a branch carrying the same commit raced it to the android-latest tag)
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run sync
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android-app/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk goban-trainer.apk
      # Fail if the APK lacks the model file app.js fetches (Android's build
      # renames some assets, e.g. it gunzips *.gz).
      - name: Check the APK has the KataGo model app.js asks for
        run: |
          model=$(grep -o '"engine/katago-small[^"]*"' www/app.js | tr -d '"' | sort -u)
          [ "$(echo "$model" | wc -l)" = 1 ] || { echo "app.js names more than one model: $model"; exit 1; }
          unzip -l goban-trainer.apk | grep -q " assets/public/$model\$" || { echo "missing $model in APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: goban-trainer-apk
          path: android-app/goban-trainer.apk
      # A stable download link for the phone: the "android-latest" release
      # always holds the newest build.
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-latest && git push -f origin android-latest
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Android app (latest build)" \
              --notes "Download goban-trainer.apk on your phone and open it to install."
          gh release upload android-latest goban-trainer.apk --clobber
          # The app compares this build number with its own versionCode on
          # launch; set it only after the APK is uploaded.
          gh release edit android-latest --title "Android app (build ${{ github.run_number }})"
      # Obtainium (the user: automatic updates without the Play Store) reads the newest release's tag as the version:
      # each build is also its own release, tagged as the APK's versionName (v1.0.N), the last three kept.
      - name: Publish a versioned release for Obtainium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v1.0.${{ github.run_number }}"
          gh release create "$v" goban-trainer.apk --target "${{ github.sha }}" --latest \
            --title "Android app $v" --notes "Install with Obtainium (github.com/chamyao/goban-trainer) or download goban-trainer.apk."
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v1\.0\.[0-9]+$' | sort -t. -k3 -n -r | tail -n +4 |
            while read old; do gh release delete "$old" --yes --cleanup-tag; done
