name: OGS probe

# Checks OGS's CORS and WebSocket origin handling for our site and app
# origins (see tools/ogs-probe/probe.mjs). Runs on demand or when the probe
# changes.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/ogs-probe/**
      - .github/workflows/ogs-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ogs-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node probe.mjs
