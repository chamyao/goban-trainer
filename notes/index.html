<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes has moved</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#1c1c1a;padding:18vh 16px}@media (prefers-color-scheme:dark){body{background:#161615;color:#ecece8}a{color:#6b93ff}}</style>
<script>
  // Notes now lives at /notes/ (its own repository). Same site, so this browser's notes and password come along.
  (async () => {
    try { for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope.includes("/goban-trainer/notes/")) await r.unregister(); } catch {}
    location.replace("/notes/" + location.hash);
  })();
</script>
</head>
<body><p>Notes has moved to <a href="/notes/">chamyao.github.io/notes</a>.</p></body>
</html>
